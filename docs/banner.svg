<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Auto Park Simulator — 차량이 장애물 사이로 스스로 주차한다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#16325C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>

  <!-- parking lot -->
  <g transform="translate(640,70)">
    <rect x="0" y="0" width="500" height="220" rx="12" fill="#0E2442" stroke="#2A4A7A" stroke-width="2"/>
    <g stroke="#E5EDF8" stroke-width="3" opacity="0.55">
      <line x1="70" y1="0" x2="70" y2="80"/><line x1="170" y1="0" x2="170" y2="80"/>
      <line x1="270" y1="0" x2="270" y2="80"/><line x1="370" y1="0" x2="370" y2="80"/>
      <line x1="470" y1="0" x2="470" y2="80"/>
    </g>
    <!-- obstacle cars -->
    <rect x="86" y="14" width="68" height="52" rx="10" fill="#7C3AED"/>
    <rect x="286" y="14" width="68" height="52" rx="10" fill="#EAB308"/>
    <!-- target slot -->
    <rect x="186" y="10" width="68" height="60" rx="8" fill="none" stroke="#16A34A" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- path -->
    <path d="M 40 190 L 300 190 Q 330 190 330 160 L 330 120 Q 330 100 300 100 L 235 100 L 220 40"
          fill="none" stroke="#1E6FD9" stroke-width="5" stroke-dasharray="3 9" stroke-linecap="round"/>
    <circle cx="220" cy="40" r="7" fill="#16A34A"/>
    <!-- ego car -->
    <g transform="translate(14,172)">
      <rect width="66" height="36" rx="9" fill="#1E6FD9"/>
      <rect x="40" y="6" width="16" height="24" rx="4" fill="#BFD9FF"/>
    </g>
  </g>

  <!-- text -->
  <text x="70" y="140" fill="#FFFFFF" font-family="'Segoe UI','Malgun Gothic',Arial,sans-serif" font-size="58" font-weight="800">Auto Park</text>
  <text x="70" y="205" fill="#FFFFFF" font-family="'Segoe UI','Malgun Gothic',Arial,sans-serif" font-size="58" font-weight="800">Simulator</text>
  <text x="72" y="248" fill="#9DB7DB" font-family="'Segoe UI','Malgun Gothic',Arial,sans-serif" font-size="22">차량이 장애물 사이로 스스로 주차한다</text>
  <text x="72" y="290" fill="#6F8FBF" font-family="'Segoe UI',Arial,sans-serif" font-size="16" letter-spacing="2">UNITY 6 · URP · WEBGL · PMS VIEW</text>
</svg>
