<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes" />
    <title>PMS View</title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #fff;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        color: #000;
      }

      /* 전체 레이아웃: 위 타이틀, 아래 캔버스 */
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
      }

      .title {
        width: min(100%, 1100px);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
        opacity: 0.95;
        text-align: center;
      }

      /* 유니티 화면을 "조금 줄인" 카드로 */
      .stage {
        position: relative;
        width: min(100%, 1100px);
        aspect-ratio: 16 / 9;
        border-radius: 18px;
        overflow: hidden;
        background: #231f20;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* 캔버스는 스테이지 꽉 채우기 */
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }

      /* 로딩 오버레이 */
      .loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
      }

      .spinner {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        border: 6px solid rgba(255, 255, 255, 0.2);
        border-top-color: rgba(255, 255, 255, 0.95);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .progressText {
        font-size: 14px;
        opacity: 0.9;
      }

      .bar {
        width: min(80%, 420px);
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0%;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 999px;
        transition: width 120ms linear;
      }
      .loading {
        color: #fff; /* 추가 */
      }

      .progressText {
        color: rgba(255, 255, 255, 0.92); /* 확실히 */
      }
    </style>
  </head>

  <body>
    <div class="app">
      <div class="title">PMS View</div>

      <div class="stage">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <div id="loading" class="loading">
          <div class="spinner"></div>
          <div class="progressText" id="progressText">Loading… 0%</div>
          <div class="bar"><div id="progressBar"></div></div>
        </div>
      </div>
    </div>

    <script src="Build/autopark.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingEl = document.querySelector("#loading");
      const progressText = document.querySelector("#progressText");
      const progressBar = document.querySelector("#progressBar");

      createUnityInstance(
        canvas,
        {
          arguments: [],
          dataUrl: "Build/autopark.data.gz",
          frameworkUrl: "Build/autopark.framework.js.gz",
          codeUrl: "Build/autopark.wasm.gz",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "My project",
          productVersion: "0.1.0",
        },
        (progress) => {
          const p = Math.round(progress * 100);
          progressText.textContent = `Loading… ${p}%`;
          progressBar.style.width = `${p}%`;
        },
      )
        .then(() => {
          loadingEl.style.display = "none";
        })
        .catch((message) => {
          progressText.textContent = "Load failed";
          alert(message);
        });
    </script>
  </body>
</html>
